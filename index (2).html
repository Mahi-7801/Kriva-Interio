<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ef">
<title>Kriva Interio | Connect With Us</title>
<style>
:root{--bg:#f7f4ef;--ink:#242321;--muted:#6f6b64;--accent:#9a7652;--line:#e5ded4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:440px;text-align:center}
.brand{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:500;margin:14px 0 8px}
p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 26px}
.links{display:grid;gap:12px}
a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:16px;font-weight:600;transition:transform .15s,border-color .15s}
a:hover{transform:translateY(-2px);border-color:var(--accent)}
.icon{width:38px;height:38px;border-radius:10px;background:#f2ece3;color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.label{flex:1;text-align:left}
.arrow{font-size:22px;color:var(--accent)}
footer{margin-top:26px;color:#8b857d;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <div class="brand">KRIVA INTERIO</div>
  <h1>Connect With Us</h1>
  <p>Explore our work, follow our updates, and get to know Kriva Interio.</p>
  <nav class="links" aria-label="Kriva Interio links">
    <a href="https://www.instagram.com/kriva.interio?mdxt=MXIzcWV5aHFpazNuOA==" target="_blank" rel="noopener noreferrer"><span class="icon">◎</span><span class="label">Instagram</span><span class="arrow">›</span></a>
    <a href="https://youtube.com/@krivainterio?si=NBlDTyYaeZHRIRLC" target="_blank" rel="noopener noreferrer"><span class="icon">▶</span><span class="label">YouTube</span><span class="arrow">›</span></a>
    <a href="https://krivainterio.com/" target="_blank" rel="noopener noreferrer"><span class="icon">↗</span><span class="label">Website</span><span class="arrow">›</span></a>
    <a href="https://www.linkedin.com/in/kriva-interio-0a7b232aa?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" rel="noopener noreferrer"><span class="icon">in</span><span class="label">LinkedIn</span><span class="arrow">›</span></a>
  </nav>
  <footer>Designing spaces. Inspiring lives.</footer>
</main>
</body>
</html>
